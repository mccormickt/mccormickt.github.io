on:
  workflow_dispatch: {}
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.167.0"
          extended: true

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v4

      - name: Test Standard.site integration
        run: python3 -m unittest discover -s tests

      - name: Build with Hugo
        run: hugo --minify

      - name: Upload Standard.site records
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: standard-site
          path: public/standard.json

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  sync-standard-site:
    needs: deploy
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Standard.site records
        uses: actions/download-artifact@v4
        with:
          name: standard-site

      - name: Publish Standard.site records
        env:
          ATPROTO_APP_PASSWORD: ${{ secrets.ATPROTO_APP_PASSWORD }}
        run: |
          if [ -z "$ATPROTO_APP_PASSWORD" ]; then
            echo "::notice::Standard.site sync is disabled. Set the ATPROTO_APP_PASSWORD repository secret to enable it."
            exit 0
          fi
          python3 scripts/sync-standard-site.py standard.json --publish
